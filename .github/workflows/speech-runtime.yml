name: Local Speech Runtime
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/speech-runtime.yml'
      - 'native/speech/**'
      - 'scripts/*speech*'
      - 'src/main/**/*[Ss]peech*'
      - 'src/shared/*speech*'
      - 'resources/speech/**'
permissions:
  contents: read
concurrency:
  group: speech-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-speech:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
      - name: Build pinned resident engine
        run: node scripts/build-speech-runtime.mjs
      - name: Verify packaged runtime contract
        run: node scripts/check-speech-runtime.mjs
      - name: Reject external Windows compiler runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Missing dependency inspection tool' }
          $imports = & $dumpbin.FullName /DEPENDENTS resources/speech/win32-x64/hhc-speech.exe
          if ($LASTEXITCODE -ne 0) { throw 'Dependency inspection failed' }
          $imports
          if ($imports -match '(?i)\b(vcruntime|msvcp|vcomp|libomp|libiomp|libgcc|libstdc)') { throw 'Unbundled compiler runtime dependency' }
      - uses: actions/cache@v4
        with:
          path: .local-runtimes/speech-smoke-models
          key: speech-models-5359861c-turbo-q5-small-v1
      - name: Native model readiness, transcription, silence and shutdown
        run: node scripts/smoke-speech-runtime.mjs ".local-runtimes/speech-smoke-models/語音 models"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: speech-runtime-${{ matrix.os }}
          path: |
            resources/speech/**/hhc-speech
            resources/speech/**/hhc-speech.exe
            resources/speech/**/manifest.json
            resources/speech/**/whisper-LICENSE
          retention-days: 7
