name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to redeploy'
        required: true
        type: string
  release:
    types: [published]
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    name: Build and Deploy Job
    steps:
      - name: Require published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false

      - uses: actions/checkout@v5.1.0
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build renderer
        env:
          VITE_HHC_ACCOUNT_ORIGIN: ${{ vars.VITE_HHC_ACCOUNT_ORIGIN }}
          VITE_HHC_ASSET_ORIGIN: ${{ vars.VITE_HHC_ASSET_ORIGIN }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_BIBLE_API_HOST: ${{ vars.VITE_BIBLE_API_HOST }}
          VITE_BIBLE_API_V1_PREFIX: ${{ vars.VITE_BIBLE_API_V1_PREFIX }}
          VITE_BIBLE_API_V2_PREFIX: ${{ vars.VITE_BIBLE_API_V2_PREFIX }}
        run: npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify hosted artifact
        run: npx playwright test e2e/hosted-artifact.spec.ts --project=chromium --workers=1 --retries=0

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_RIVER_03BBB7100 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: 'out/renderer'
          api_location: ''
          output_location: ''
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_RIVER_03BBB7100 }}
          action: 'close'
